name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore BankaApp.sln

      - name: Build
        run: dotnet build BankaApp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test BankaApp.sln --configuration Release --no-build --verbosity normal
